name: Publish to npm

on:
  release:
    types: [created]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm publishes the version in package.json, so the release tag has to match it.
      - name: Check the version matches the release
        run: |
          node -e '
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const version = require("./package.json").version;
            if (tag !== version) {
              console.error(`::error::The release tag is ${process.env.GITHUB_REF_NAME}, but package.json says ${version}.`);
              process.exit(1);
            }
          '

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # There is no npm token: npm signs this workflow in through OIDC, with the
      # trusted publisher set up for the package on npmjs.com.
      - name: Publish with provenance
        run: npm publish --provenance --access public
